name: Firmware

# Builds the flashable image so nobody has to set up a toolchain locally.
# Every push produces a downloadable .bin under the run's Artifacts; pushing a
# tag (v2.9.1, ...) also attaches it to the matching GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build X4 / X3 image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # only used by the release step on tag pushes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The ESP32 toolchain, the Arduino core and the ESP-IDF venv all live
      # here and total a few GB; caching them turns a ~20 minute cold run into
      # a ~5 minute one. The key tracks prepare.sh because that pins the
      # upstream commit the toolchain versions come from.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('custom-bin-builds/prepare.sh', '.github/workflows/firmware.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: ./custom-bin-builds/build.sh

      # The committed .bin and this one differ in the ESP app descriptor
      # (project name, build date/time, app ELF hash), so the checksums are
      # reported rather than compared.
      - name: Report checksums
        run: |
          {
            echo '### Firmware built'
            echo
            echo '```'
            cat custom-bin-builds/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosspoint-1.6.0rc-xteink-anki-x4_x3
          path: |
            custom-bin-builds/crosspoint-1.6.0rc-xteink-anki-x4_x3.bin
            custom-bin-builds/SHA256SUMS
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" \
            custom-bin-builds/crosspoint-1.6.0rc-xteink-anki-x4_x3.bin \
            custom-bin-builds/SHA256SUMS \
            --clobber
